<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SmartLab – {{ site }}</title>
<style>
:root{--bg:#0b111c;--panel:#101828;--tile:#141e30;--line:#2b3a52;--ink:#eef3fa;--mute:#a9b8cf;--ok:#6ee7b0;--okbg:#0f3326;
--warn:#f2a33a;--warnink:#ffc46b;--warnbg:#4a3008;--alarm:#ff5a5a;--alarmink:#ff8a8a;--off:#4a5568;--offbg:#2d3748}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Segoe UI",system-ui,sans-serif}
.wrap{min-height:100vh;padding:18px 22px;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.brand b{font-size:30px;font-weight:800}.brand div{color:var(--mute);font-size:17px}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{padding:9px 16px;border-radius:999px;font-size:18px;font-weight:700;background:#16243a;color:#cfe0f5}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.warn{background:var(--warnbg);color:var(--warnink)}
.chip.alarm{background:var(--alarm);color:#1b0505}.chip.offline{background:var(--offbg);color:#d5dde8}
.clock{text-align:right}.clock b{font-size:40px;font-variant-numeric:tabular-nums}.clock div{color:var(--mute)}
.banner{display:none;align-items:center;gap:16px;padding:12px 18px;border-radius:12px;background:#3a0f14;border:2px solid var(--alarm);font-size:21px;font-weight:600;color:#ffe1e1}
.banner.on{display:flex}.banner b{color:var(--alarmink);font-weight:800}
.main{display:flex;gap:16px;flex-wrap:wrap}
.panel{background:var(--panel);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel h2{margin:0;font-size:22px}.panel .sub{color:var(--mute);font-size:16px}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.grid{display:grid;gap:12px}
.left{flex:999 1 900px}.right{flex:1 1 560px;display:flex;flex-direction:column;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
@media (max-width:1100px){.g4,.g6{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(1,minmax(0,1fr))}}
.tile{background:var(--tile);border:2px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile.warn{border-color:var(--warn);background:#1f1a10}.tile.alarm{border-color:var(--alarm);background:#2a1216}
.tile.offline{border-color:var(--off);background:#141a24}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.code{font-size:19px;font-weight:800;color:#cfe0f5;letter-spacing:.03em}
.badge{font-size:13px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--okbg);color:var(--ok);white-space:nowrap}
.warn .badge{background:var(--warnbg);color:var(--warnink)}.alarm .badge{background:var(--alarm);color:#1b0505}
.offline .badge{background:var(--offbg);color:#d5dde8}
.name{font-size:15px;color:#dbe4f0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.val{white-space:nowrap;font-size:44px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.warn .val{color:var(--warnink)}.alarm .val{color:var(--alarmink)}.offline .val{color:#8a97aa}
.unit{font-size:18px;color:var(--mute);font-weight:500}
.note{font-size:13px;color:var(--mute)}
.st{align-self:flex-start;padding:5px 12px;border-radius:999px;font-size:19px;font-weight:800;background:#1d2b44;color:#bcd0ea}
.st.run{background:var(--okbg);color:var(--ok)}.st.err{background:var(--alarm);color:#1b0505}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px}
.kv span{display:block;font-size:13px;color:var(--mute)}.kv b{font-size:21px;font-variant-numeric:tabular-nums}
footer{display:flex;gap:22px;flex-wrap:wrap;color:var(--mute);font-size:15px;align-items:center}
.lg{display:inline-flex;align-items:center;gap:8px}
.tile[data-code]{cursor:pointer}.tile[data-code]:hover,.tile[data-code]:focus{outline:2px solid #5b8def;outline-offset:2px}
footer a{color:#9fc1ff}
.ov{position:fixed;inset:0;background:rgba(3,7,14,.72);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.ov.on{display:flex}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:min(1100px,100%);max-height:100%;overflow:auto;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.dlg h3{margin:0;font-size:24px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns button,.btns a{font:inherit;font-size:15px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:#16243a;color:#dbe4f0;cursor:pointer;text-decoration:none;min-height:40px;box-sizing:border-box}
.btns button.on{background:#1d5fd1;border-color:#1d5fd1;color:#fff}
.stats{display:flex;gap:18px;flex-wrap:wrap;color:var(--mute);font-size:15px}.stats b{color:var(--ink)}
.chart{background:#0d1524;border-radius:12px;padding:8px}
.snd{font:inherit;font-size:15px;font-weight:700;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:#16243a;color:#cfe0f5;cursor:pointer;margin-top:6px}
.snd.on{background:var(--okbg);color:var(--ok);border-color:#1f6b4c}.snd:focus{outline:3px solid #5b8def;outline-offset:2px}
.banner .mute{margin-left:12px;font:inherit;font-size:17px;font-weight:700;padding:6px 14px;border-radius:8px;border:0;background:#ffe1e1;color:#3a0f14;cursor:pointer}
.gate{position:fixed;inset:0;background:rgba(3,7,14,.8);display:none;align-items:center;justify-content:center;z-index:20}
.gate.on{display:flex}.gate button{font:inherit;font-size:30px;font-weight:800;padding:24px 40px;border-radius:16px;border:0;background:#1d5fd1;color:#fff;cursor:pointer}
.gate button:focus{outline:4px solid #fff;outline-offset:4px}.lg i{width:14px;height:14px;border-radius:4px;display:inline-block}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><b>SmartLab</b><div>{{ site }}</div></div>
    <div class="chips" id="chips"></div>
    <div class="clock"><b id="clock">--:--</b><div id="date"></div><button type="button" class="snd" id="snd" aria-pressed="false">Âm thanh: TẮT</button></div>
  </header>
  <div class="banner" id="banner" role="alert"></div>
  <div class="main">
    <section class="panel left" aria-label="Tủ bảo quản">
      <div class="ph"><h2>Tủ bảo quản</h2><span class="sub">Biểu đồ nhỏ: 24 giờ</span></div>
      <div class="grid g4" id="fridges"></div>
    </section>
    <div class="right">
      <section class="panel" aria-label="Nước RO">
        <div class="ph"><h2>Nước RO – độ dẫn điện</h2></div>
        <div class="grid g3" id="ro"></div>
      </section>
      <section class="panel" aria-label="Máy xét nghiệm">
        <h2>Máy xét nghiệm</h2>
        <div class="grid g2" id="xn"></div>
      </section>
    </div>
  </div>
  <section class="panel" aria-label="Môi trường phòng xét nghiệm">
    <div class="ph"><h2>Môi trường phòng xét nghiệm</h2></div>
    <div class="grid g6" id="rooms"></div>
  </section>
  <footer>
    <span class="lg"><i style="background:var(--line)"></i>Bình thường</span>
    <span class="lg"><i style="background:var(--warn)"></i>Gần ngưỡng / đang xác nhận</span>
    <span class="lg"><i style="background:var(--alarm)"></i>Vượt ngưỡng (đã báo Zalo)</span>
    <span class="lg"><i style="background:var(--off)"></i>Mất tín hiệu</span>
    <a href="/so-theo-doi">Sổ theo dõi ISO</a>
    <a href="/cai-dat">Cài đặt</a>
    <span style="margin-left:auto" id="updated"></span>
  </footer>
</div>
<div class="gate" id="gate"><button type="button" id="gateBtn">Bấm OK để bật âm thanh cảnh báo</button></div>
<div class="ov" id="ov" role="dialog" aria-modal="true" aria-labelledby="ovTitle">
  <div class="dlg">
    <div class="row"><h3 id="ovTitle"></h3><div class="btns"><button type="button" id="ovClose">Đóng</button></div></div>
    <div class="btns" id="ovRange">
      <button type="button" data-days="1">24 giờ</button><button type="button" data-days="7">7 ngày</button><button type="button" data-days="30">30 ngày</button>
      <a id="ovCsv" href="#">Tải CSV</a><a href="/so-theo-doi">Sổ theo dõi</a>
    </div>
    <div id="ovBody"></div>
  </div>
</div>
<script>
const TZ = "Asia/Ho_Chi_Minh";
const LABEL = {ok: "Bình thường", warn: "Gần ngưỡng", alarm: "VƯỢT NGƯỠNG", offline: "Mất tín hiệu"};
const XN_STATUS = {running: ["Đang chạy", "run"], standby: ["Chờ mẫu", ""], error: ["Lỗi", "err"], maintenance: ["Bảo trì", ""]};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function spark(vals, state) {
  if (!vals || vals.length < 2) return "";
  const lo = Math.min(...vals), hi = Math.max(...vals), span = (hi - lo) || 1;
  const pts = vals.map((v, i) => `${(2 + i * 100 / (vals.length - 1)).toFixed(1)},${(27 - (v - lo) / span * 24).toFixed(1)}`).join(" ");
  const color = {ok: "#5b8def", warn: "#f2a33a", alarm: "#ff5a5a", offline: "#4a5568"}[state];
  return `<svg width="104" height="30" viewBox="0 0 104 30" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/></svg>`;
}
const head = p => `<div class="row"><span class="code">${esc(p.code)}</span><span class="badge">${LABEL[p.state]}</span></div><div class="name">${esc(p.name)}</div>`;

function fridge(p) {
  return `<div class="tile ${p.state}" data-code="${esc(p.code)}" role="button" tabindex="0">${head(p)}
    <div class="row" style="align-items:flex-end"><div><span class="val">${esc(p.display)}</span> <span class="unit">°C</span></div>${spark(p.spark, p.state)}</div>
    <div class="note">Ngưỡng ${esc(p.range)}${p.last_seen ? " · " + p.last_seen : ""}</div></div>`;
}
function ro(p) {
  const err = p.extra && p.extra.read_error ? ` · đọc lỗi: ${esc(p.extra.read_error)}` : "";
  return `<div class="tile ${p.state}" data-code="${esc(p.code)}" role="button" tabindex="0">${head(p)}
    <div style="white-space:nowrap"><span class="val" style="font-size:38px">${esc(p.display)}</span> <span class="unit">µS/cm</span></div>
    <div class="note">${esc(p.range)} · ${esc(p.source_label.split(" ")[0])}${p.last_seen ? " · " + p.last_seen : ""}${err}</div></div>`;
}
function room(p) {
  return `<div class="tile ${p.state}" data-code="${esc(p.code)}" role="button" tabindex="0">${head(p)}
    <div class="row" style="align-items:baseline"><span class="val" style="font-size:34px">${esc(p.display)}<span class="unit"> °C</span></span>
    <span class="val" style="font-size:28px">${esc(p.display2)}<span class="unit"> %</span></span></div>
    <div class="note">${esc(p.message || p.range)}</div></div>`;
}
function xn(p) {
  const e = p.extra || {}, s = XN_STATUS[e.status] || [p.state === "offline" ? "Không có dữ liệu" : (e.status || "—"), ""];
  return `<div class="tile ${p.state === "offline" ? "offline" : ""}"><div class="row"><span class="code" style="font-size:21px">${esc(p.name)}</span><span class="note">${esc(p.code)}</span></div>
    <span class="st ${s[1]}">${esc(s[0])}</span>
    <div class="kv"><div><span>Kết quả cuối</span><b>${esc(e.last_result ?? "—")}</b></div><div><span>Mẫu hôm nay</span><b>${esc(e.samples_today ?? "—")}</b></div>
    <div><span>TAT trung vị</span><b>${e.tat_median_min != null ? esc(e.tat_median_min) + " phút" : "—"}</b></div><div><span>IQC hôm nay</span><b>${esc(e.iqc ?? "—")}</b></div></div></div>`;
}

// ---------------------------------------------------------------- âm thanh cảnh báo (tivi / máy trực)
// Cấu hình ở trang /cai-dat/am-thanh (tải lại mỗi phút). Trình duyệt chỉ cho phát tiếng sau khi người dùng
// bấm 1 lần -> nút "Âm thanh" / màn "Bấm OK". Vượt ngưỡng: chuông + giọng đọc, nhắc lại tới khi hết.
// Mất tín hiệu: 1 tiếng chuông nhẹ (+ giọng đọc nếu có), chỉ 1 lần cho mỗi điểm.
const Sound = {
  enabled: false, ctx: null, mutedUntil: 0, alarmSet: new Set(), offSet: new Set(), lastPlay: 0, first: true,
  cfg: {chime: "3", volume: 70, repeat_minutes: 5, mute_minutes: 30, offline_chime: true, voice: "off",
        alarm_text: "Cảnh báo. {ten} vượt ngưỡng.", offline_text: "", clips: {}, default_on: false},
  buffers: {},
  get REPEAT_MS() { return this.cfg.repeat_minutes * 60000; },
  get MUTE_MS() { return this.cfg.mute_minutes * 60000; },
  store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  async loadCfg() {
    try { this.cfg = await (await fetch("/api/sound", {cache: "no-store"})).json(); } catch (e) { return; }
    if (this.ctx) this.preload();
  },
  async init() {
    const q = new URLSearchParams(location.search).get("sound");
    if (q === "1") this.store("smartlab_sound", "1");
    if (q === "0") this.store("smartlab_sound", "0");
    await this.loadCfg();
    const pref = this.load("smartlab_sound");
    if (pref === "1" || (pref !== "0" && this.cfg.default_on)) {
      document.getElementById("gate").classList.add("on");
      setTimeout(() => document.getElementById("gateBtn").focus(), 300);
    }
    setInterval(() => this.loadCfg(), 60000);
  },
  unlock() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    this.ctx = this.ctx || new AC();
    if (this.ctx.state === "suspended") this.ctx.resume();
    this.preload();
    return true;
  },
  async preload() {                       // tải sẵn file giọng đọc để phát ngay khi báo động
    for (const kinds of Object.values(this.cfg.clips || {})) for (const url of Object.values(kinds)) {
      if (this.buffers[url]) continue;
      try {
        const data = await (await fetch(url)).arrayBuffer();
        this.buffers[url] = await new Promise((ok, bad) => this.ctx.decodeAudioData(data, ok, bad));
      } catch (e) {}
    }
  },
  set(on) {
    this.enabled = on && this.unlock();
    this.store("smartlab_sound", this.enabled ? "1" : "0");
    const btn = document.getElementById("snd");
    btn.textContent = this.enabled ? "Âm thanh: BẬT" : "Âm thanh: TẮT";
    btn.classList.toggle("on", this.enabled); btn.setAttribute("aria-pressed", String(this.enabled));
    document.getElementById("gate").classList.remove("on");
    if (this.enabled) { this.tone([[660, .18], [0, .08], [880, .25]]); this.lastPlay = 0; this.first = true; refresh(); }
  },
  tone(seq, vol) {                        // trả về số giây phát
    if (!this.ctx) return 0;
    vol = vol ?? this.cfg.volume / 100 * 0.7;
    const start = this.ctx.currentTime + 0.05; let t = start;
    for (const [f, dur] of seq) {
      if (f) {
        const o = this.ctx.createOscillator(), g = this.ctx.createGain();
        o.type = "square"; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(Math.max(vol, 0.001), t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g).connect(this.ctx.destination); o.start(t); o.stop(t + dur + 0.02);
      }
      t += dur;
    }
    return t - start;
  },
  playClips(urls, delay) {                // phát lần lượt các file giọng đọc
    let t = this.ctx.currentTime + delay;
    for (const u of urls) {
      const b = this.buffers[u]; if (!b) continue;
      const src = this.ctx.createBufferSource(); src.buffer = b; src.connect(this.ctx.destination);
      src.start(t); t += b.duration + 0.4;
    }
  },
  say(text, delay) {
    const sy = window.speechSynthesis;
    if (!sy || !sy.getVoices || !text) return;
    const v = sy.getVoices().find(x => /^vi/i.test(x.lang));
    if (!v) return;                       // không có giọng tiếng Việt -> chỉ phát chuông
    const u = new SpeechSynthesisUtterance(text.replace(/−/g, "âm ").replace(/…/g, " đến ").replace(/µS\/cm/g, " micro si-men")
      .replace(/%/g, " phần trăm").replace(/≤/g, "tối đa ").replace(/°C/g, " độ C").replace(/(\d),(\d)/g, "$1 phẩy $2"));
    u.voice = v; u.lang = v.lang; u.rate = 0.95;
    setTimeout(() => sy.speak(u), (delay || 0) * 1000);
  },
  fill(tpl, p) { return (tpl || "").replace(/\{ten\}/g, p.name).replace(/\{ma\}/g, p.code); },
  voice(points, kind, delay) {
    const c = this.cfg;
    if (c.voice === "fpt") this.playClips(points.map(p => ((c.clips || {})[p.code] || {})[kind]).filter(Boolean), delay);
    if (c.voice === "browser") this.say(points.map(p => this.fill(kind === "alarm" ? c.alarm_text : c.offline_text, p)
      + (kind === "alarm" && p.message ? " " + p.message : "")).join(". "), delay);
  },
  alarm(points) {
    const hi = [988, .22], lo = [740, .22], gap = [0, .12], n = {"3": 3, "1": 1, "0": 0}[this.cfg.chime] ?? 3;
    const seq = []; for (let i = 0; i < n; i++) seq.push(hi, lo, hi, lo, gap);
    const len = this.tone(seq);
    this.voice(points, "alarm", len + 0.3);
    this.lastPlay = Date.now();
  },
  update(points) {
    const alarm = points.filter(p => p.state === "alarm"), off = points.filter(p => p.state === "offline");
    const newAlarm = alarm.filter(p => !this.alarmSet.has(p.code));
    const newOff = this.first ? [] : off.filter(p => !this.offSet.has(p.code));   // mở trang: không kêu cho điểm mất tín hiệu từ trước
    this.alarmSet = new Set(alarm.map(p => p.code));
    this.offSet = new Set(off.map(p => p.code));
    const first = this.first; this.first = false;
    if (!this.enabled || !this.ctx || Date.now() < this.mutedUntil) return;
    if (alarm.length && (newAlarm.length || first || Date.now() - this.lastPlay >= this.REPEAT_MS)) {
      this.alarm(newAlarm.length ? newAlarm : alarm);
    } else if (newOff.length && this.cfg.offline_chime) {
      this.voice(newOff, "offline", this.tone([[523, .25], [0, .1], [392, .4]], this.cfg.volume / 100 * 0.4) + 0.3);
    }
  },
};

async function refresh() {
  try {
    const r = await fetch("/api/status", {cache: "no-store"});
    const d = await r.json();
    const by = g => d.points.filter(p => g.includes(p.group));
    document.getElementById("fridges").innerHTML = by(["fridge", "freezer"]).map(fridge).join("");
    document.getElementById("ro").innerHTML = by(["ro"]).map(ro).join("");
    document.getElementById("rooms").innerHTML = by(["room"]).map(room).join("");
    document.getElementById("xn").innerHTML = by(["analyzer"]).map(xn).join("");
    const c = d.counts;
    document.getElementById("chips").innerHTML =
      `<span class="chip">${d.total} điểm giám sát</span><span class="chip ok">${c.ok} bình thường</span>` +
      (c.warn ? `<span class="chip warn">${c.warn} gần ngưỡng</span>` : "") +
      (c.alarm ? `<span class="chip alarm">${c.alarm} vượt ngưỡng</span>` : "") +
      (c.offline ? `<span class="chip offline">${c.offline} mất tín hiệu</span>` : "");
    const b = document.getElementById("banner");
    const alarms = d.active_alarms.filter(a => a.state === "alarm"), offs = d.active_alarms.filter(a => a.state === "offline");
    b.innerHTML = alarms.length ? `<b>VƯỢT NGƯỠNG</b> ${alarms.map(a => esc(a.code + " · " + a.name + ": " + a.message)).join(" | ")}`
      + (offs.length ? `<span style="margin-left:auto;font-size:17px;color:#d5dde8">${offs.map(a => esc(a.code)).join(", ")} mất tín hiệu</span>` : "") : "";
    if (alarms.length && Sound.enabled) b.insertAdjacentHTML("beforeend", Sound.mutedUntil > Date.now()
      ? `<span class="note" style="margin-left:12px">Đã tạm tắt tiếng tới ${new Date(Sound.mutedUntil).toLocaleTimeString("vi-VN", {timeZone: TZ, hour: "2-digit", minute: "2-digit"})}</span>`
      : `<button type="button" class="mute" id="mute">Tạm tắt tiếng 30 phút</button>`);
    b.classList.toggle("on", alarms.length > 0);
    Sound.update(d.points);
    document.getElementById("updated").textContent = "Cập nhật " + new Date(d.now).toLocaleTimeString("vi-VN", {timeZone: TZ});
  } catch (e) {
    document.getElementById("updated").textContent = "Mất kết nối máy chủ – đang thử lại…";
  }
}
function tick() {
  const n = new Date();
  document.getElementById("clock").textContent = n.toLocaleTimeString("vi-VN", {timeZone: TZ, hour: "2-digit", minute: "2-digit"});
  document.getElementById("date").textContent = n.toLocaleDateString("vi-VN", {timeZone: TZ, weekday: "long", day: "2-digit", month: "2-digit", year: "numeric"});
}
const MET = {temperature: ["Nhiệt độ", "°C", 1], humidity: ["Độ ẩm", "%", 0], ec: ["EC", "µS/cm", 2]};
const vn = (v, d) => v == null ? "--" : v.toFixed(d).replace(".", ",").replace("-", "−");
let ovCode = null, ovDays = 1;

function chart(m, info, lim) {
  const W = 1000, H = 240, L = 56, R = 12, T = 12, B = 30;
  const s = info.series; if (!s.length) return "";
  const t = s.map(p => Date.parse(p[0])), v = s.map(p => p[1]);
  const lines = [lim[0], lim[1]].filter(x => x != null);
  let lo = Math.min(...v, ...lines), hi = Math.max(...v, ...lines);
  const pad = (hi - lo) * 0.1 || 1; lo -= pad; hi += pad;
  const t0 = t[0], t1 = t[t.length - 1] || t0 + 1;
  const X = x => L + (x - t0) / ((t1 - t0) || 1) * (W - L - R), Y = y => T + (hi - y) / (hi - lo) * (H - T - B);
  const pts = s.map((p, i) => `${X(t[i]).toFixed(1)},${Y(v[i]).toFixed(1)}`).join(" ");
  const lab = x => new Date(x).toLocaleString("vi-VN", {timeZone: TZ, day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit"});
  const d = MET[m][2];
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Biểu đồ ${MET[m][0]}">
    ${lines.map(y => `<line x1="${L}" x2="${W - R}" y1="${Y(y)}" y2="${Y(y)}" stroke="#ff5a5a" stroke-dasharray="6 5"/><text x="${L - 6}" y="${Y(y) + 4}" fill="#ff8a8a" font-size="12" text-anchor="end">${vn(y, d)}</text>`).join("")}
    <text x="${L - 6}" y="${T + 10}" fill="#a9b8cf" font-size="12" text-anchor="end">${vn(hi, d)}</text>
    <text x="${L - 6}" y="${H - B}" fill="#a9b8cf" font-size="12" text-anchor="end">${vn(lo, d)}</text>
    <polyline points="${pts}" fill="none" stroke="#5b8def" stroke-width="2" stroke-linejoin="round"/>
    <text x="${L}" y="${H - 8}" fill="#a9b8cf" font-size="12">${lab(t0)}</text>
    <text x="${W - R}" y="${H - 8}" fill="#a9b8cf" font-size="12" text-anchor="end">${lab(t1)}</text></svg>`;
}

async function openHistory(code, days) {
  ovCode = code; ovDays = days;
  document.getElementById("ov").classList.add("on");
  document.querySelectorAll("#ovRange button").forEach(b => b.classList.toggle("on", +b.dataset.days === days));
  const end = new Date(), start = new Date(end.getTime() - (days - 1) * 864e5);
  const day = x => x.toLocaleDateString("sv-SE", {timeZone: TZ});
  document.getElementById("ovCsv").href = `/export/readings.csv?code=${encodeURIComponent(code)}&start=${day(start)}&end=${day(end)}`;
  const body = document.getElementById("ovBody");
  body.textContent = "Đang tải…";
  try {
    const d = await (await fetch(`/api/history/${encodeURIComponent(code)}?days=${days}`, {cache: "no-store"})).json();
    document.getElementById("ovTitle").textContent = `${d.code} · ${d.name}`;
    const L = d.limits, lims = {temperature: [L.temp_min, L.temp_max], humidity: [L.hum_min, L.hum_max], ec: [null, L.ec_max]};
    const parts = Object.keys(MET).filter(m => d.metrics[m]).map(m => {
      const i = d.metrics[m], [name, unit, dg] = MET[m];
      return `<div class="stats"><b>${name} (${unit})</b><span>Thấp nhất <b>${vn(i.min, dg)}</b></span><span>Cao nhất <b>${vn(i.max, dg)}</b></span><span>Trung bình <b>${vn(i.avg, dg)}</b></span><span>${i.count} lần đo</span></div><div class="chart">${chart(m, i, lims[m])}</div>`;
    });
    body.innerHTML = parts.join("") || `<p class="stats">Chưa có số đo trong khoảng thời gian này.</p>`;
  } catch (e) { body.textContent = "Không tải được dữ liệu."; }
}
function closeHistory() { document.getElementById("ov").classList.remove("on"); ovCode = null; }
document.addEventListener("click", e => {
  const t = e.target.closest("[data-code]");
  if (t) openHistory(t.dataset.code, 1);
  const b = e.target.closest("#ovRange button");
  if (b && ovCode) openHistory(ovCode, +b.dataset.days);
  if (e.target.id === "ovClose" || e.target.id === "ov") closeHistory();
});
document.getElementById("snd").addEventListener("click", () => Sound.set(!Sound.enabled));
document.getElementById("gateBtn").addEventListener("click", () => Sound.set(true));
document.addEventListener("click", e => {
  if (e.target.id === "mute") { Sound.mutedUntil = Date.now() + Sound.MUTE_MS; window.speechSynthesis && speechSynthesis.cancel(); refresh(); }
});
if (window.speechSynthesis) speechSynthesis.getVoices();   // nạp danh sách giọng sớm
// Giữ màn hình luôn sáng (trình duyệt hỗ trợ)
async function keepAwake() { try { if (navigator.wakeLock) await navigator.wakeLock.request("screen"); } catch (e) {} }
keepAwake(); document.addEventListener("visibilitychange", () => document.visibilityState === "visible" && keepAwake());
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeHistory();
  if ((e.key === "Enter" || e.key === " ") && e.target.dataset && e.target.dataset.code) { e.preventDefault(); openHistory(e.target.dataset.code, 1); }
});

Sound.init(); refresh(); tick(); setInterval(refresh, 10000); setInterval(tick, 1000);
</script>
</body>
</html>
