; Đọc log Roche CommServer -> ô "Máy xét nghiệm" trên dashboard.
; Bản cài tự tạo C:\SmartLabHS\app\xn_log.ini từ file này nếu chưa có. Sửa xong: nssm restart SmartLab-XNLog

[chung]
interval_sec = 60                 ; mỗi 60 giây đọc phần log mới
; Dịch vụ chạy bằng tài khoản SYSTEM thường KHÔNG đọc được thư mục chia sẻ của máy khác (Access is denied).
; Cách chắc chắn: cho dịch vụ chạy bằng tài khoản Windows đọc được thư mục đó (vd tài khoản Roche):
;   nssm set SmartLab-XNLog ObjectName ".\Roche" "MatKhau"   rồi   nssm restart SmartLab-XNLog
; Hoặc điền tài khoản của máy chứa log:
; share_user = 10.0.0.20\TenTaiKhoan
; share_password = MatKhau

[xn01]                            ; cobas pro 1
log = \\10.0.0.20\CommServer\800--3.log

[xn02]                            ; cobas pro 2
log = \\10.0.0.20\CommServer\800--5.log
