; ---------------------------------------------------------------- cobas pro 1
; SỬA tên bảng/cột cho đúng CSDL thật (xem bằng: python tools\xn_bridge.py --schema)
[xn01]
may = COBAS_PRO_1             ; giá trị cột "máy" trong CSDL, dùng trong SQL là :may
running_window_min = 10
samples_today  = SELECT COUNT(DISTINCT sid) FROM ket_qua WHERE may = :may AND thoi_gian_tra >= :dau_ngay
last_result    = SELECT MAX(thoi_gian_tra) FROM ket_qua WHERE may = :may AND thoi_gian_tra >= :dau_ngay
tat_median_min = SELECT TIMESTAMPDIFF(MINUTE, thoi_gian_nhan, thoi_gian_tra) FROM ket_qua WHERE may = :may AND thoi_gian_tra >= :dau_ngay
iqc            = SELECT IF(SUM(dat = 0) > 0, 'Không đạt', 'Đạt') FROM iqc WHERE may = :may AND thoi_gian >= :dau_ngay HAVING COUNT(*) > 0
; status       = (bỏ trống: tự suy ra từ last_result)

