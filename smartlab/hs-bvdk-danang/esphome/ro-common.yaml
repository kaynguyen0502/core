# Module đo độ dẫn điện nước RO – ESP32 + bộ chuyển đổi RS485 + bộ phát EC công nghiệp (Modbus RTU).
# Đầu dò EC lắp inline (T-fitting) trên ống RO cấp máy XN, hằng số cell K=0.1 hoặc 0.01 cho nước tinh khiết.
# !! Địa chỉ thanh ghi / hệ số chia KHÁC NHAU theo hãng bộ phát: đối chiếu datasheet trước khi nạp.
esphome:
  name: ${device}
  friendly_name: ${device}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  baud_rate: 0          # UART0 nhường cho log USB; RS485 dùng UART2
api:
  encryption:
    key: !secret api_key
ota:
  - platform: esphome
    password: !secret ota_password
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${device}-fallback"
    password: !secret fallback_password
captive_portal:

uart:
  id: rs485
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 9600
  parity: NONE
  stop_bits: 1

modbus:
  uart_id: rs485
  # flow_control_pin: GPIO4   # bật nếu module RS485 cần chân DE/RE (MAX485)

modbus_controller:
  - id: ec_tx
    address: 1
    update_interval: 30s

sensor:
  - platform: modbus_controller
    modbus_controller_id: ec_tx
    name: "ec"
    id: ec
    register_type: holding
    address: 0x0000          # TODO: thanh ghi EC theo datasheet
    value_type: U_WORD
    unit_of_measurement: "µS/cm"
    accuracy_decimals: 2
    state_class: measurement
    filters:
      - multiply: 0.01       # TODO: hệ số chia theo datasheet
      - median: {window_size: 5, send_every: 2}
  - platform: modbus_controller
    modbus_controller_id: ec_tx
    name: "nhiet do nuoc"
    register_type: holding
    address: 0x0001          # TODO: thanh ghi nhiệt độ (nếu bộ phát có bù nhiệt)
    value_type: S_WORD
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
  - platform: wifi_signal
    name: "wifi"
    update_interval: 60s
