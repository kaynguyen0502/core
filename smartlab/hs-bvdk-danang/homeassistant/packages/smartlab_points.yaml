  - binary_sensor:
      - name: "Cảnh báo tl01"
        unique_id: smartlab_tl01_alarm
        device_class: problem
        delay_on: {minutes: 15}
        delay_off: {minutes: 2}
        state: "{% set ns = namespace(bad=false) %}{% set v = states('sensor.smartlab_tl01_nhiet_do') %}{% if is_number(v) and (v | float < 2.0 or v | float > 8.0) %}{% set ns.bad = true %}{% endif %}{{ ns.bad }}"
        attributes:
          diem_do: "Tủ lạnh 01"
          nguong: "nhiệt độ 2…8"
          gia_tri: "nhiệt độ {{ states('sensor.smartlab_tl01_nhiet_do') }}"
      - name: "Mất tín hiệu tl01"
        unique_id: smartlab_tl01_offline
        device_class: problem
        delay_on: {minutes: 60}
        state: "{{ states('sensor.tl01_raw_temperature') in [\"unavailable\", \"unknown\"] }}"
        attributes:
