automation:
  - id: smartlab_canh_bao_nguong
    alias: SmartLab – báo Zalo khi vượt ngưỡng / hết vượt ngưỡng
    mode: queued
    trigger:
      - platform: state
        entity_id:
          - binary_sensor.canh_bao_tl01
          - binary_sensor.canh_bao_tl02
          - binary_sensor.canh_bao_tl03
          - binary_sensor.canh_bao_tl04
          - binary_sensor.canh_bao_tl05
          - binary_sensor.canh_bao_tl06
          - binary_sensor.canh_bao_tl07
          - binary_sensor.canh_bao_tl08
          - binary_sensor.canh_bao_tl09
          - binary_sensor.canh_bao_tl10
          - binary_sensor.canh_bao_tl11
          - binary_sensor.canh_bao_tl12
          - binary_sensor.canh_bao_mt01
          - binary_sensor.canh_bao_mt02
          - binary_sensor.canh_bao_mt03
          - binary_sensor.canh_bao_mt04
          - binary_sensor.canh_bao_mt05
          - binary_sensor.canh_bao_mt06
          - binary_sensor.canh_bao_ro01
          - binary_sensor.canh_bao_ro02
          - binary_sensor.canh_bao_ro03
        from: ["off", "on"]
        to: ["on", "off"]
    action:
      - action: script.smartlab_zalo
        data:
          message: >-
            {% if trigger.to_state.state == 'on' %}🔴 CẢNH BÁO {{ trigger.to_state.attributes.diem_do }}:
            {{ trigger.to_state.attributes.gia_tri }} (ngưỡng {{ trigger.to_state.attributes.nguong }}).
            Đề nghị kiểm tra ngay.{% else %}✅ ĐÃ BÌNH THƯỜNG {{ trigger.to_state.attributes.diem_do }}:
            {{ trigger.to_state.attributes.gia_tri }}.{% endif %}
            ({{ now().strftime('%H:%M %d/%m') }})

  - id: smartlab_mat_tin_hieu
    alias: SmartLab – báo Zalo khi cảm biến mất tín hiệu
    mode: queued
    trigger:
      - platform: state
        entity_id:
          - binary_sensor.mat_tin_hieu_tl01
          - binary_sensor.mat_tin_hieu_tl02
          - binary_sensor.mat_tin_hieu_tl03
          - binary_sensor.mat_tin_hieu_tl04
          - binary_sensor.mat_tin_hieu_tl05
          - binary_sensor.mat_tin_hieu_tl06
          - binary_sensor.mat_tin_hieu_tl07
          - binary_sensor.mat_tin_hieu_tl08
          - binary_sensor.mat_tin_hieu_tl09
          - binary_sensor.mat_tin_hieu_tl10
          - binary_sensor.mat_tin_hieu_tl11
          - binary_sensor.mat_tin_hieu_tl12
          - binary_sensor.mat_tin_hieu_mt01
          - binary_sensor.mat_tin_hieu_mt02
          - binary_sensor.mat_tin_hieu_mt03
          - binary_sensor.mat_tin_hieu_mt04
          - binary_sensor.mat_tin_hieu_mt05
          - binary_sensor.mat_tin_hieu_mt06
          - binary_sensor.mat_tin_hieu_ro01
          - binary_sensor.mat_tin_hieu_ro02
          - binary_sensor.mat_tin_hieu_ro03
        from: ["off", "on"]
        to: ["on", "off"]
    action:
      - action: script.smartlab_zalo
        data:
          message: >-
            {% if trigger.to_state.state == 'on' %}⚠️ MẤT TÍN HIỆU {{ trigger.to_state.attributes.diem_do }} quá 60 phút
            (kiểm tra pin / sóng Zigbee / nguồn).{% else %}✅ Có tín hiệu lại: {{ trigger.to_state.attributes.diem_do }}.{% endif %}
            ({{ now().strftime('%H:%M %d/%m') }})

  - id: smartlab_nhac_lai
    alias: SmartLab – nhắc lại mỗi 30 phút khi còn cảnh báo
    trigger:
      - platform: time_pattern
        minutes: "/30"
    condition:
      - condition: state
        entity_id: group.smartlab_alarms
        state: "on"
    action:
      - action: script.smartlab_zalo
        data:
          message: >-
            🔁 VẪN ĐANG CẢNH BÁO:
            {% for e in expand('group.smartlab_alarms') | selectattr('state', 'eq', 'on') %}
            • {{ e.attributes.diem_do }}: {{ e.attributes.gia_tri }} (từ {{ as_local(e.last_changed).strftime('%H:%M') }})
            {% endfor %}

  - id: smartlab_ghi_so_dinh_ky
    alias: SmartLab – ghi sổ theo dõi nhiệt độ/độ ẩm/EC (ISO 15189)
    trigger:
      - platform: time
        at: ["07:30:00", "13:30:00", "19:30:00"]
    action:
      - action: script.smartlab_ghi_so

script:
  smartlab_ghi_so:
    alias: SmartLab ghi sổ theo dõi
    sequence:
      - action: notify.send_message
        target:
          entity_id: notify.smartlab_so_theo_doi
        data:
          message: >-
            {{ now().strftime('%Y-%m-%d %H:%M') }} | Tủ lạnh 01: {{ states('sensor.smartlab_tl01_nhiet_do') }} °C | Tủ lạnh 02: {{ states('sensor.smartlab_tl02_nhiet_do') }} °C | Tủ lạnh 03: {{ states('sensor.smartlab_tl03_nhiet_do') }} °C | Tủ lạnh 04: {{ states('sensor.smartlab_tl04_nhiet_do') }} °C | Tủ lạnh 05: {{ states('sensor.smartlab_tl05_nhiet_do') }} °C | Tủ lạnh 06: {{ states('sensor.smartlab_tl06_nhiet_do') }} °C | Tủ lạnh 07: {{ states('sensor.smartlab_tl07_nhiet_do') }} °C | Tủ lạnh 08: {{ states('sensor.smartlab_tl08_nhiet_do') }} °C | Tủ lạnh 09: {{ states('sensor.smartlab_tl09_nhiet_do') }} °C | Tủ lạnh 10: {{ states('sensor.smartlab_tl10_nhiet_do') }} °C | Tủ đông 11: {{ states('sensor.smartlab_tl11_nhiet_do') }} °C | Tủ đông 12: {{ states('sensor.smartlab_tl12_nhiet_do') }} °C | Phòng XN 01: {{ states('sensor.smartlab_mt01_nhiet_do') }} °C, {{ states('sensor.smartlab_mt01_do_am') }} % | Phòng XN 02: {{ states('sensor.smartlab_mt02_nhiet_do') }} °C, {{ states('sensor.smartlab_mt02_do_am') }} % | Phòng XN 03: {{ states('sensor.smartlab_mt03_nhiet_do') }} °C, {{ states('sensor.smartlab_mt03_do_am') }} % | Phòng XN 04: {{ states('sensor.smartlab_mt04_nhiet_do') }} °C, {{ states('sensor.smartlab_mt04_do_am') }} % | Phòng XN 05: {{ states('sensor.smartlab_mt05_nhiet_do') }} °C, {{ states('sensor.smartlab_mt05_do_am') }} % | Phòng XN 06: {{ states('sensor.smartlab_mt06_nhiet_do') }} °C, {{ states('sensor.smartlab_mt06_do_am') }} % | Máy RO 01: {{ states('sensor.smartlab_ro01_ec') }} µS/cm | Máy RO 02: {{ states('sensor.smartlab_ro02_ec') }} µS/cm | Máy RO 03: {{ states('sensor.smartlab_ro03_ec') }} µS/cm
