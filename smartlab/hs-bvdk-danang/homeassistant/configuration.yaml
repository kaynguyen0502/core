# Home Assistant – SmartLab Khoa Hóa Sinh, BVĐK Đà Nẵng
default_config:

homeassistant:
  name: SmartLab Hóa Sinh
  time_zone: Asia/Ho_Chi_Minh
  country: VN
  language: vi
  unit_system: metric
  packages: !include_dir_named packages

# Giữ lịch sử 2 năm để tra cứu / in sổ khi đánh giá ISO 15189.
# 21 điểm đo, SQLite mặc định đủ dùng; sao lưu hằng ngày (xem README).
recorder:
  purge_keep_days: 730
  commit_interval: 30
  exclude:
    domains: [automation, script, update]

lovelace:
  mode: storage
  dashboards:
    smartlab-tv:
      mode: yaml
      title: SmartLab
      icon: mdi:thermometer-lines
      show_in_sidebar: true
      filename: dashboards/smartlab.yaml
